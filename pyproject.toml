[project]
name = "classificationhealthdiabetes"
version = "0.1.0"
description = "Educational diabetes risk check: scikit-learn model served through a Streamlit app"
readme = "README.md"
authors = [
    { name = "bawamehar", email = "bawamehar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "scikit-learn>=1.6.1",
    "pandas>=2.3.1",
    "numpy",
    "joblib",
    "crewai>=1.15",
    "mcp>=1.28",
]

# not an installable package, so no [build-system]; exact versions are pinned in requirements.txt

[dependency-groups]
dev = [
    "xgboost>=2.1.4",
    "lightgbm>=4.7.0",
    "mlflow>=3.16",
    "fastapi",
    "uvicorn",
    "psycopg2-binary",
    "pytest",
    "ipykernel>=6.30.1",
]
