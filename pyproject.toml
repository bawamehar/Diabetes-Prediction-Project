[project]
name = "classificationhealthdiabetes"
version = "0.1.0"
description = "Educational diabetes risk check: scikit-learn model served through a Streamlit app"
readme = "README.md"
authors = [
    { name = "bawamehar", email = "bawamehar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "scikit-learn>=1.6.1",
    "pandas>=2.3.1",
    "numpy",
    "joblib",
]

# This is an application, not an installable package, so there is no [build-system].
# Exact, tested versions for deployment are pinned in requirements.txt.

[dependency-groups]
dev = [
    "xgboost>=2.1.4",
    "lightgbm>=4.7.0",
    "fastapi",
    "uvicorn",
    "psycopg2-binary",
    "pytest",
    "ipykernel>=6.30.1",
]
